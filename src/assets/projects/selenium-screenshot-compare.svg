<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Left screenshot -->
  <g transform="translate(48 100)">
    <rect width="190" height="260" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
    <rect x="0" y="0" width="190" height="32" rx="12" fill="#2d4a6f"/>
    <rect rx="12" ry="0" x="0" y="0" width="190" height="32" fill="#2d4a6f"/>
    <circle cx="18" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#eab308"/>
    <circle cx="54" cy="16" r="5" fill="#22c55e"/>
    <rect x="70" y="10" width="100" height="12" rx="6" fill="#1e293b"/>
    <!-- Page content blocks -->
    <rect x="16" y="48" width="158" height="14" rx="4" fill="#3b82f6" opacity=".5"/>
    <rect x="16" y="72" width="120" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="90" width="140" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="108" width="100" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="132" width="158" height="60" rx="6" fill="#334155"/>
    <rect x="16" y="204" width="158" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="222" width="120" height="10" rx="3" fill="#64748b" opacity=".5"/>
  </g>
  <!-- Right screenshot -->
  <g transform="translate(274 100)">
    <rect width="190" height="260" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
    <rect x="0" y="0" width="190" height="32" rx="12" fill="#2d4a6f"/>
    <circle cx="18" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#eab308"/>
    <circle cx="54" cy="16" r="5" fill="#22c55e"/>
    <rect x="70" y="10" width="100" height="12" rx="6" fill="#1e293b"/>
    <!-- Page content with differences highlighted -->
    <rect x="16" y="48" width="158" height="14" rx="4" fill="#3b82f6" opacity=".5"/>
    <rect x="16" y="72" width="120" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="90" width="140" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="108" width="100" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="132" width="158" height="60" rx="6" fill="#334155"/>
    <!-- Diff highlight zones -->
    <rect x="16" y="132" width="158" height="60" rx="6" fill="#ef4444" opacity=".25" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
    <rect x="16" y="204" width="158" height="10" rx="3" fill="#64748b" opacity=".5"/>
    <rect x="16" y="222" width="90" height="10" rx="3" fill="#ef4444" opacity=".4"/>
  </g>
  <!-- Center comparison arrows -->
  <g transform="translate(244 210)">
    <polygon points="0,0 12,10 0,20" fill="#f59e0b"/>
  </g>
  <g transform="translate(250 250)">
    <polygon points="12,0 0,10 12,20" fill="#f59e0b"/>
  </g>
  <!-- Diff percentage badge -->
  <rect x="186" y="390" width="140" height="36" rx="18" fill="#ef4444" opacity=".9"/>
  <text x="256" y="414" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#ffffff">DIFF 12.4%</text>
</svg>
